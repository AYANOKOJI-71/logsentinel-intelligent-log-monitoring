[project]
name = "logsentinel"
version = "1.0.0"
description = "Kafka-backed intelligent log monitoring and anomaly detection portfolio project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
streaming = ["confluent-kafka>=2.6,<3.0"]
search = ["opensearch-py>=2.7,<3.0"]
test = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
